# Builds the Diolog fork's image (docker/diolog.dockerfile) for linux/arm64 and pushes it to
# ghcr.io/diolog26/uptime-kuma. The status cell (dAIolog apps/infra/cells/status) runs it by digest.
# Upstream's own workflows are removed on this branch: they build and release upstream, and some
# run on a schedule from the default branch.
name: Diolog image

on:
  push:
    branches: [diolog]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker buildx build --platform linux/arm64 -f docker/diolog.dockerfile \
            -t ghcr.io/diolog26/uptime-kuma:diolog -t "ghcr.io/diolog26/uptime-kuma:${GITHUB_SHA}" \
            --metadata-file metadata.json --push .
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          echo "Image: \`ghcr.io/diolog26/uptime-kuma@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/diolog26/uptime-kuma@${digest}"
